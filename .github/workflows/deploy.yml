name: Deploy to Cloud Run

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: コードをチェックアウト
        uses: actions/checkout@v4

      - name: GCPに認証
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: gcloud CLIをセットアップ
        uses: google-github-actions/setup-gcloud@v2

      - name: Cloud Runにデプロイ
        run: |
          gcloud run deploy stats-api \
            --source . \
            --region asia-northeast1 \
            --platform managed \
            --allow-unauthenticated \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --set-env-vars="ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }},ESTAT_APP_ID=${{ secrets.ESTAT_APP_ID }},GMAIL_ADDRESS=${{ secrets.GMAIL_ADDRESS }},GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}"
