# 一回限り: _M_sangyo の作成と 2026年9月分の求人への産業分類コード付け直し（実行後にこのファイルは削除する）
name: oneoff-sangyo
on:
  push:
    branches: [main]
    paths: [.github/workflows/oneoff_sangyo.yml]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q httpx pandas pyarrow google-cloud-storage beautifulsoup4
      - name: GCS認証情報を設定
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > /tmp/sa_key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa_key.json" >> $GITHUB_ENV
          echo "GCS_BUCKET_NAME=${{ secrets.GCS_BUCKET_NAME }}" >> $GITHUB_ENV
      - name: マスタ作成と付け直し
        run: python -c "import app.collectors.hellowork as hw; hw.save_sangyo_master(dry_run=False); hw.backfill_sangyo('202609', dry_run=False)"
      - name: 認証情報を削除
        if: always()
        run: rm -f /tmp/sa_key.json
