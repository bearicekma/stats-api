# 地方財政状況調査（総務省）調査表CSVの収集ワークフロー
# - 手動実行: Actions 画面で mode を選ぶ（dryrun=確認のみ / full=全期間取り直し / update=差分）
# - 定期実行: 毎月6日 06:00 JST に update（年1回・3月末ごろの公開を拾う）
# 公開リポジトリのためログは公開される。appId など秘匿情報は出力しないこと

name: collect-chizai

on:
  schedule:
    - cron: '0 21 5 * *'   # 毎月5日 21:00 UTC = 6日 06:00 JST
  workflow_dispatch:
    inputs:
      mode:
        description: 'dryrun / full / update'
        required: true
        default: 'dryrun'
        type: choice
        options: [dryrun, full, update]

concurrency:
  group: collect-chizai
  cancel-in-progress: false

permissions:
  contents: write   # 実行ログを chizai-log ブランチに保存するため

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # 初回（full）は約1,800ファイルで1〜2時間の見込み

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: pip install httpx pandas pyarrow google-cloud-storage

      - name: GCS認証情報を設定
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > /tmp/sa_key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa_key.json" >> $GITHUB_ENV
          echo "GCS_BUCKET_NAME=${{ secrets.GCS_BUCKET_NAME }}" >> $GITHUB_ENV

      - name: 収集スクリプトを実行
        id: run
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: |
          set -o pipefail
          PYTHONUNBUFFERED=1 python scripts/collect_chizai.py ${{ github.event.inputs.mode || 'update' }} pref 2>&1 | tee /tmp/chizai_output.log

      - name: 認証情報を削除
        if: always()
        run: rm -f /tmp/sa_key.json

      # ops.yml と同じ方式。Actionsのログ本体を外部から読めない環境向けに、ブランチへ上書き保存する
      - name: 実行ログを chizai-log ブランチに保存
        if: always()
        env:
          STATUS: ${{ steps.run.outcome }}
          MODE: ${{ github.event.inputs.mode || 'update' }}
        run: |
          mkdir -p /tmp/chizailog && cd /tmp/chizailog
          {
            echo "commit: ${GITHUB_SHA}"
            echo "mode: ${MODE}"
            echo "status: ${STATUS}"
            echo "finished_at: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S JST')"
            echo "run_url: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "----"
            cat /tmp/chizai_output.log 2>/dev/null || echo "(出力なし)"
          } > run.log
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add run.log
          git commit -q -m "chizai log: ${MODE} ${STATUS}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:chizai-log
